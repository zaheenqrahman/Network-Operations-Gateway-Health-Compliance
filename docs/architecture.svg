<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">NetOps Gateway architecture</title>
  <desc id="desc">Meraki Cloud feeds live telemetry into the NetOps Gateway Flask API, which is queried by an operations console or client.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#071425"/><stop offset="1" stop-color="#0d1f33"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#5cc8ff"/><stop offset="1" stop-color="#2e7df6"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="980" height="260" rx="18" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g fill="#12283f" stroke="#4fb8ff" stroke-width="2" filter="url(#shadow)">
      <rect x="40" y="75" width="260" height="110" rx="16"/>
      <rect x="358" y="60" width="260" height="140" rx="18" fill="#152d4d" stroke="#72d5ff"/>
      <rect x="680" y="75" width="260" height="110" rx="16" fill="#1e2d3f" stroke="#ffcc6a"/>
    </g>
    <g fill="#eaf6ff" text-anchor="middle">
      <text x="170" y="116" font-size="22" font-weight="700">Meraki Cloud</text>
      <text x="170" y="146" font-size="15" fill="#9ecae9">Live network &amp; device telemetry</text>
      <text x="488" y="106" font-size="22" font-weight="700">NetOps Gateway</text>
      <text x="488" y="134" font-size="15" fill="#9ecae9">Flask API + compliance engine</text>
      <text x="488" y="158" font-size="13" fill="#7fb8e0">deployed on Azure App Service</text>
      <text x="810" y="112" font-size="22" font-weight="700" fill="#fff4d6">Client / Console</text>
      <text x="810" y="140" font-size="15" fill="#f8d995">Queries health, compliance, alerts</text>
    </g>
    <rect x="88" y="165" width="164" height="12" rx="6" fill="url(#blue)"/>
    <rect x="726" y="150" width="148" height="12" rx="6" fill="url(#gold)"/>
    <g stroke="#7edcff" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M300 130h58"/>
      <path d="M618 130h62"/>
    </g>
  </g>
</svg>
